<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medbot Clinic AI Concierge Demo</title>
    <style>
      :root {
        color-scheme: light;
        --blue: #0789c9;
        --blue-dark: #0574ad;
        --bg: #eef4f8;
        --text: #102033;
        --muted: #62748a;
        --border: #d7e2ea;
        --card: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--text);
        background: var(--bg);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 520px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 20px 60px rgba(20, 50, 80, 0.14);
        overflow: hidden;
      }

      header {
        background: var(--blue);
        color: white;
        padding: 18px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        font-size: 18px;
        line-height: 1.2;
        margin: 0;
      }

      .status {
        margin-top: 4px;
        font-size: 13px;
        opacity: 0.9;
      }

      .leads-link {
        color: white;
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 13px;
        white-space: nowrap;
      }

      #messages {
        height: min(62vh, 620px);
        overflow-y: auto;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        max-width: 86%;
        padding: 12px 14px;
        border-radius: 8px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-wrap: break-word;
        border: 1px solid var(--border);
      }

      .bot {
        align-self: flex-start;
        background: white;
      }

      .user {
        align-self: flex-end;
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }

      form {
        border-top: 1px solid var(--border);
        padding: 14px;
        display: flex;
        gap: 10px;
        background: #f8fbfd;
      }

      input {
        flex: 1;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px 13px;
        font: inherit;
        color: var(--text);
      }

      input:focus {
        outline: 2px solid rgba(7, 137, 201, 0.22);
        border-color: var(--blue);
      }

      button {
        border: 0;
        border-radius: 6px;
        background: var(--blue);
        color: white;
        font: inherit;
        font-weight: 600;
        padding: 0 16px;
        cursor: pointer;
      }

      button:hover {
        background: var(--blue-dark);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      footer {
        padding: 0 18px 14px;
        color: var(--muted);
        font-size: 12px;
        background: #f8fbfd;
      }

      @media (max-width: 520px) {
        body {
          padding: 0;
        }

        main {
          min-height: 100vh;
          border-radius: 0;
        }

        #messages {
          height: calc(100vh - 180px);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Клиника Здоровье</h1>
          <div class="status">ИИ-консьерж онлайн</div>
        </div>
        <a
          class="leads-link"
          href="https://t.me/democlinicleads"
          target="_blank"
          rel="noreferrer"
        >
          Leads chat
        </a>
      </header>

      <section id="messages" aria-live="polite"></section>

      <form id="chat-form">
        <input
          id="message-input"
          name="message"
          autocomplete="off"
          placeholder="Напишите сообщение..."
          required
        />
        <button id="send-button" type="submit">Send</button>
      </form>

      <footer>
        Demo stand for the clinic AI concierge. Completed leads are sent to the
        configured Make.com automation.
      </footer>
    </main>

    <script>
      const messages = document.querySelector("#messages");
      const form = document.querySelector("#chat-form");
      const input = document.querySelector("#message-input");
      const button = document.querySelector("#send-button");

      const sessionKey = "medbot-session-id";
      const existingSessionId = sessionStorage.getItem(sessionKey);
      const sessionId =
        existingSessionId ||
        (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
      sessionStorage.setItem(sessionKey, sessionId);

      function addMessage(role, text) {
        const node = document.createElement("div");
        node.className = `message ${role}`;
        node.textContent = text;
        messages.appendChild(node);
        messages.scrollTop = messages.scrollHeight;
      }

      async function askBot(text) {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Concierge-Session-Id": sessionId,
          },
          body: JSON.stringify({ message: text }),
        });
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }
        return data.reply || "Не удалось получить ответ.";
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        addMessage("user", text);
        button.disabled = true;

        try {
          const reply = await askBot(text);
          addMessage("bot", reply);
        } catch (error) {
          addMessage("bot", error.message || "Ошибка запроса.");
        } finally {
          button.disabled = false;
          input.focus();
        }
      });

      addMessage(
        "bot",
        "Здравствуйте! Я виртуальный консультант клиники. Чем могу помочь?",
      );
    </script>
  </body>
</html>
